<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formby Location Selector | The Formby Commons</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --color-navy: #1B365D;
      --color-green: #2D6A4F;
      --color-green-hover: #1b4332;
      --color-gold: #D9A036;
      --color-bg: #FAF8F5;
      --color-card-bg: #FFFFFF;
      --color-text: #2C3E50;
      --color-text-muted: #5A6B7C;
      --color-border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    header {
      background-color: var(--color-navy);
      color: #ffffff;
      padding: 16px 20px;
      text-align: center;
      border-bottom: 3px solid var(--color-gold);
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.9;
      font-weight: 500;
    }

    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    .panel {
      background-color: var(--color-card-bg);
      border-top: 1px solid var(--color-border);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 2;
      box-shadow: 0 -4px 15px rgba(27, 54, 93, 0.06);
    }

    .instructions {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      text-align: center;
      line-height: 1.4;
    }

    .output-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      font-size: 1.05rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-weight: 600;
    }

    button {
      background-color: var(--color-green);
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    button:hover {
      background-color: var(--color-green-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    @media (max-width: 640px) {
      header h1 {
        font-size: 1.2rem;
      }
      header p {
        font-size: 0.88rem;
      }
      .instructions {
        font-size: 0.88rem;
      }
      input[type="text"] {
        font-size: 0.95rem;
        padding: 10px 12px;
      }
      button {
        padding: 10px 16px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>The Formby Commons</h1>
    <p>Location Helper</p>
  </header>

  <div id="map"></div>

  <div class="panel">
    <div class="instructions">
      Tap or click anywhere on the map (or drag the pin) to pinpoint the issue location.
    </div>
    <div class="output-box">
      <input type="text" id="coords" readonly value="Select a location..." aria-label="Coordinates">
      <button id="copy-btn" onclick="copyCoordinates()">Copy</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Bounding Box: Ainsdale (North) to Ince Blundell (South)
    const bounds = L.latLngBounds(
      L.latLng(53.5150, -3.1200),
      L.latLng(53.5800, -2.9900)
    );

    const initialCenter = [53.5555, -3.0645];

    const map = L.map('map', {
      maxBounds: bounds,
      maxBoundsViscosity: 0.8,
      minZoom: 12,
      maxZoom: 18
    }).setView(initialCenter, 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const marker = L.marker(initialCenter, {
      draggable: true
    }).addTo(map);

    const coordInput = document.getElementById('coords');
    const copyBtn = document.getElementById('copy-btn');

    function updateCoordinates(lat, lng) {
      coordInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }

    updateCoordinates(initialCenter[0], initialCenter[1]);

    marker.on('dragend', function () {
      const pos = marker.getLatLng();
      updateCoordinates(pos.lat, pos.lng);
    });

    map.on('click', function (e) {
      marker.setLatLng(e.latlng);
      updateCoordinates(e.latlng.lat, e.latlng.lng);
    });

    function copyCoordinates() {
      if (coordInput.value && coordInput.value !== "Select a location...") {
        navigator.clipboard.writeText(coordInput.value).then(() => {
          const originalText = copyBtn.innerText;
          copyBtn.innerText = "Copied!";
          
          setTimeout(() => {
            copyBtn.innerText = originalText;
          }, 2000);
        });
      }
    }
  </script>
</body>
</html>
